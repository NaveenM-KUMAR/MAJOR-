{% extends "base.html" %}

{% block title %}403 — Access Forbidden{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <h1 class="display-1 fw-extrabold text-danger">403</h1>
        <h3 class="fw-bold mb-3">Access Denied</h3>
        <p class="text-muted lead mb-4">You do not have administrative or owner permission to access this resource.</p>
        <a href="{{ url_for('auth.index') }}" class="btn btn-primary rounded-pill px-4 fw-bold">Return Home</a>
    </div>
</div>
{% endblock %}
