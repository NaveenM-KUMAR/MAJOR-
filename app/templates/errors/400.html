{% extends "base.html" %}

{% block title %}400 — Bad Request{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <h1 class="display-1 fw-extrabold text-warning">400</h1>
        <h3 class="fw-bold mb-3">Bad Request</h3>
        <p class="text-muted lead mb-4">The server could not understand your request or invalid parameters were provided.</p>
        <a href="{{ url_for('auth.index') }}" class="btn btn-primary rounded-pill px-4 fw-bold">Return Home</a>
    </div>
</div>
{% endblock %}
