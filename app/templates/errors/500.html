{% extends "base.html" %}

{% block title %}500 — Internal Server Error{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <h1 class="display-1 fw-extrabold text-secondary">500</h1>
        <h3 class="fw-bold mb-3">Internal Server Error</h3>
        <p class="text-muted lead mb-4">An unexpected error occurred while processing your request. Please try again shortly.</p>
        <a href="{{ url_for('auth.index') }}" class="btn btn-primary rounded-pill px-4 fw-bold">Return Home</a>
    </div>
</div>
{% endblock %}
