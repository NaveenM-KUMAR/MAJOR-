{% extends "base.html" %}

{% block title %}404 — Page Not Found{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <h1 class="display-1 fw-extrabold text-primary">404</h1>
        <h3 class="fw-bold mb-3">Page Not Found</h3>
        <p class="text-muted lead mb-4">The parking space or page you are looking for might have been moved or does not exist.</p>
        <a href="{{ url_for('auth.index') }}" class="btn btn-primary rounded-pill px-4 fw-bold">Return Home</a>
    </div>
</div>
{% endblock %}
