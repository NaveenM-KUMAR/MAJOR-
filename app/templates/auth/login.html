{% extends "base.html" %}

{% block title %}Login — Community Parking System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 p-4">
                <div class="text-center mb-4">
                    <div class="brand-icon d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle p-3 mb-2">
                        <i class="bi bi-shield-lock-fill fs-3"></i>
                    </div>
                    <h3 class="fw-bold">Welcome Back</h3>
                    <p class="text-muted small">Log in to manage bookings, spaces, or platform controls</p>
                </div>

                <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" name="email" id="emailInput" class="form-control" placeholder="name@example.com" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label fw-semibold small mb-0">Password</label>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" name="password" id="passwordInput" class="form-control" placeholder="Enter password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 fw-bold mb-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Log In
                    </button>
                </form>

                <div class="p-3 bg-light rounded-3 border mb-3">
                    <div class="d-flex align-items-center justify-content-between mb-2">
                        <span class="small fw-bold text-dark"><i class="bi bi-shield-lock me-1"></i> Administrator Access</span>
                        <span class="badge bg-success" style="font-size: 0.65rem;">LIVE MODE</span>
                    </div>
                    <button type="button" class="btn btn-sm btn-outline-danger w-100 mb-2 fw-bold" onclick="fillLogin('admin@cps.com', 'admin123')">
                        <i class="bi bi-shield-check me-1"></i> 1-Click Master Admin (admin@cps.com)
                    </button>
                    <div class="d-flex gap-2">
                        <a href="{{ url_for('auth.register') }}" class="btn btn-sm btn-outline-success flex-grow-1">
                            <i class="bi bi-buildings me-1"></i> Register Owner
                        </a>
                        <a href="{{ url_for('auth.register') }}" class="btn btn-sm btn-outline-primary flex-grow-1">
                            <i class="bi bi-car-front me-1"></i> Register Driver
                        </a>
                    </div>
                </div>

                <div class="text-center text-muted small">
                    Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-primary fw-semibold text-decoration-none">Register here</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function fillLogin(email, password) {
    document.getElementById('emailInput').value = email;
    document.getElementById('passwordInput').value = password;
}
</script>
{% endblock %}
